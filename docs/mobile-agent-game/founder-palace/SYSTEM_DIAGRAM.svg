<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Founder Palace system diagram</title>
  <desc id="desc">Scoped company context flows through validation into the seven-stage learning engine, versioned knowledge graph, coach, approval boundary, adapters, and authoritative receipts.</desc>
