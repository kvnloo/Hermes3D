name: Preview Artifact Cleanup
on:
  schedule: [{cron: '37 5 * * *'}]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: preview-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - name: Delete only expired feature preview artifacts
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == true and (.name | startswith("feature-preview-"))) | .id' |
          while read -r id; do [[ -z "$id" ]] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done
