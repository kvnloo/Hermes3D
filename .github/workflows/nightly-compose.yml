name: Nightly Compose
on:
  push:
    branches: [dev]
    paths: ['.gitops/nightly-manifest.json']
  workflow_dispatch:
    inputs:
      dry_run: {description: 'Plan and verify without writing refs', type: boolean, default: true}
permissions:
  contents: read
concurrency:
  group: nightly-integrate
  cancel-in-progress: false
jobs:
  compose:
    name: integration / conflict-and-order
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST: .gitops/nightly-manifest.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Validate desired state and repository metadata
        run: |
          set -euo pipefail
          node scripts/gitops-policy.mjs validate-nightly "$MANIFEST"
          expected_base="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then expected_base="$(git rev-parse HEAD^)"; fi
          test "$(jq -r .base.sha "$MANIFEST")" = "$expected_base"
          jq -c '.features[]' "$MANIFEST" | while read -r feature; do
            pr="$(jq -r .pullRequest <<<"$feature")"; expected="$(jq -r .headSha <<<"$feature")"; branch="$(jq -r .branch <<<"$feature")"
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            test "$(jq -r .draft <<<"$actual")" = true
            test "$(jq -r .base.ref <<<"$actual")" = dev
            test "$(jq -r .head.repo.full_name <<<"$actual")" = "$GITHUB_REPOSITORY"
            test "$(jq -r .head.ref <<<"$actual")" = "$branch"
            test "$(jq -r .head.sha <<<"$actual")" = "$expected"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/labels" --jq '.[].name' | grep -Fx nightly-eligible >/dev/null
            failures="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${expected}/check-runs" --jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length')"
            test "$failures" = 0
          done
      - name: Compose exact pinned SHAs
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          jq -r '.features | sort_by(.order,.slug)[] | .headSha' "$MANIFEST" | while read -r sha; do
            git fetch --no-tags origin "$sha"
            git merge --no-ff --no-edit "$sha"
          done
          node scripts/gitops-policy.mjs scan
          git fsck --strict
          git rev-parse HEAD^{tree} > nightly-tree.sha
          sha256sum "$MANIFEST" > nightly-manifest.sha256
      - name: Advance disposable nightly alias with immutable receipt tag
        if: github.event_name == 'push' && vars.NIGHTLY_AUTOMATION_ENABLED == 'true'
        run: |
          set -euo pipefail
          digest="$(cut -c1-12 nightly-manifest.sha256)"
          stamp="$(date -u +%Y%m%d-%H%M)"
          old="$(git ls-remote origin refs/heads/nightly | cut -f1)"
          if [[ -n "$old" ]]; then git tag -a "nightly/${stamp}-${digest}" "$old" -m "Preserved nightly tip before generation $(jq -r .generation "$MANIFEST")"; git push origin "refs/tags/nightly/${stamp}-${digest}"; fi
          git push --force-with-lease="refs/heads/nightly:${old}" origin HEAD:refs/heads/nightly
      - name: Attest trusted nightly receipt
        if: github.event_name == 'push' && vars.NIGHTLY_AUTOMATION_ENABLED == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            nightly-tree.sha
            nightly-manifest.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-receipt-${{ github.sha }}
          path: |
            .gitops/nightly-manifest.json
            nightly-tree.sha
            nightly-manifest.sha256
          retention-days: 90
