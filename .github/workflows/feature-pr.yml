name: Feature PR
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    if: startsWith(github.head_ref, 'feature/hermes3d/') || startsWith(github.head_ref, 'promotion/')
    name: policy / public-safety
    runs-on: ubuntu-latest
    env:
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - run: node scripts/gitops-policy.mjs scan
  quality:
    name: quality / node-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@1e60f620b9541d7c243d3c8ba53230b38466c9b8 # v4.0.3
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - run: npm run smoke:dev-server
  preview:
    name: provenance / preview-artifact
    needs: [policy, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@1e60f620b9541d7c243d3c8ba53230b38466c9b8 # v4.0.3
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts && npm run build
      - name: Package inert preview and hashes
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf hermes3d-preview.tar.gz .next server package.json package-lock.json
          sha256sum hermes3d-preview.tar.gz > preview.sha256
          node scripts/gitops-policy.mjs scan .next server package.json package-lock.json preview.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature-preview-${{ github.event.pull_request.head.sha }}
          path: |
            hermes3d-preview.tar.gz
            preview.sha256
          retention-days: 7
          if-no-files-found: error
