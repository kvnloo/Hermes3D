name: Feature PR
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: policy / public-safety
    runs-on: ubuntu-latest
    env:
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: node scripts/gitops-policy.mjs scan
  quality:
    name: quality / node-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - run: npm run smoke:dev-server
  preview:
    name: provenance / preview-artifact
    needs: [policy, quality]
    runs-on: ubuntu-latest
    env:
      HERMES3D_GITOPS_BUILD_ID: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - name: Deterministic rebuild, SBOM, provenance, and strict manifest
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node scripts/gitops-policy.mjs validate-build .next "$HERMES3D_GITOPS_BUILD_ID"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --exclude='.next/cache' --exclude='.next/trace' --exclude='.next/trace-build' -czf preview-a.tar.gz .next server public next.config.ts package.json package-lock.json
          cp .next/cache/.previewinfo .next/cache/.rscinfo "$RUNNER_TEMP/"
          rm -rf .next
          mkdir -p .next/cache
          cp "$RUNNER_TEMP/.previewinfo" "$RUNNER_TEMP/.rscinfo" .next/cache/
          npm run build
          node scripts/gitops-policy.mjs validate-build .next "$HERMES3D_GITOPS_BUILD_ID"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --exclude='.next/cache' --exclude='.next/trace' --exclude='.next/trace-build' -czf hermes3d-preview.tar.gz .next server public next.config.ts package.json package-lock.json
          cmp preview-a.tar.gz hermes3d-preview.tar.gz
          runtime="$RUNNER_TEMP/preview-runtime"
          mkdir -p "$runtime"
          tar -xzf hermes3d-preview.tar.gz -C "$runtime"
          (
            cd "$runtime"
            npm ci --ignore-scripts
            host="$(printf '%s.%s.%s.%s' 127 0 0 1)"
            HOST="$host" PORT=31337 HERMES3D_BUILD_ID="$GITHUB_SHA" node server/index.js > "$RUNNER_TEMP/preview-runtime.log" 2>&1 &
            server_pid=$!
            trap 'if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi' EXIT
            status=000
            for attempt in {1..60}; do
              if status="$(curl -sS -o "$RUNNER_TEMP/preview-health.json" -w '%{http_code}' "http://$host:31337/api/health")"; then
                if [[ "$status" == 200 ]]; then break; fi
              else
                status=000
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/preview-runtime.log"; exit 1; fi
              sleep 1
            done
            test "$status" = 200
            jq -e --arg sha "$GITHUB_SHA" '.ok == true and .service == "hermes3d" and .buildId == $sha' "$RUNNER_TEMP/preview-health.json"
          )
          npm sbom --sbom-format cyclonedx > preview-sbom.json
          printf '{"builder":"github-actions","workflow":"%s","commit":"%s","tree":"%s"}\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" > preview-provenance.json
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; expires="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg repo "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg commit "$GITHUB_SHA" --arg tree "$(git rev-parse HEAD^{tree})" --arg created "$created" --arg expires "$expires" \
            --arg ad "$(sha256sum hermes3d-preview.tar.gz|cut -d' ' -f1)" --argjson ab "$(stat -c%s hermes3d-preview.tar.gz)" \
            --arg sd "$(sha256sum preview-sbom.json|cut -d' ' -f1)" --argjson sb "$(stat -c%s preview-sbom.json)" \
            --arg pd "$(sha256sum preview-provenance.json|cut -d' ' -f1)" --argjson pb "$(stat -c%s preview-provenance.json)" \
            '{schemaVersion:1,repository:$repo,runId:$run,runAttempt:$attempt,commitSha:$commit,treeSha:$tree,artifact:{name:"hermes3d-preview.tar.gz",digest:$ad,bytes:$ab},sbom:{name:"preview-sbom.json",digest:$sd,bytes:$sb},provenance:{name:"preview-provenance.json",digest:$pd,bytes:$pb},createdAt:$created,expiresAt:$expires}' > preview-manifest.json
          node scripts/gitops-policy.mjs validate-preview preview-manifest.json .
          node scripts/gitops-policy.mjs scan preview-provenance.json preview-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feature-preview-${{ github.event.pull_request.head.sha }}
          path: |
            hermes3d-preview.tar.gz
            preview-sbom.json
            preview-provenance.json
            preview-manifest.json
          retention-days: 7
          if-no-files-found: error
