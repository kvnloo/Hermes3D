name: Upstream Candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: upstream-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exclusion:
    if: startsWith(github.head_ref, 'upstream-candidate/perf-') && github.event.pull_request.draft
    name: policy / upstream-exclusion
    runs-on: ubuntu-latest
    env:
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - run: |
          set -euo pipefail
          node scripts/gitops-policy.mjs scan
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}')"
          if grep -E '^(\.gitops/|\.github/workflows/nightly-|docs/gitops-)' <<<"$changed"; then exit 1; fi
