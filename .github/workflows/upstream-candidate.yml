name: Upstream Candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: upstream-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exclusion:
    if: startsWith(github.head_ref, 'upstream-candidate/perf-') && github.event.pull_request.draft
    name: policy / upstream-exclusion
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false, fetch-depth: 0}
      - name: Bind true upstream base and reject product-specific content
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_REPOSITORY"; test "$UPSTREAM_REPOSITORY" != "$GITHUB_REPOSITORY"
          upstream_url="$(gh api "repos/$UPSTREAM_REPOSITORY" --jq .clone_url)"
          upstream_branch="$(gh api "repos/$UPSTREAM_REPOSITORY" --jq .default_branch)"
          git remote add true-upstream "$upstream_url"
          git fetch --no-tags true-upstream "$upstream_branch"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          test "$(git merge-base "$upstream_sha" '${{ github.event.pull_request.head.sha }}')" = "$upstream_sha"
          changed="$(git diff --name-only --diff-filter=ACMRD "$upstream_sha...${{ github.event.pull_request.head.sha }}")"
          test -n "$changed"
          if grep -E '^(\.gitops/|\.github/(rulesets/|workflows/nightly-|workflows/promotion)|docs/gitops-|public/(agents|exhibits|museum)/|src/.*(agent|exhibit|museum|hermes)|server/.*(gateway|hermes))' <<<"$changed"; then exit 1; fi
          GITHUB_BASE_SHA="$upstream_sha" node scripts/gitops-policy.mjs scan
          jq -n --arg upstreamRepository "$UPSTREAM_REPOSITORY" --arg upstreamBranch "$upstream_branch" --arg upstreamSha "$upstream_sha" --arg candidateSha '${{ github.event.pull_request.head.sha }}' --arg changedDigest "$(sha256sum <<<"$changed"|cut -d' ' -f1)" '{schemaVersion:1,lane:"generic-performance-only",upstreamRepository:$upstreamRepository,upstreamBranch:$upstreamBranch,upstreamSha:$upstreamSha,candidateSha:$candidateSha,changedPathsDigest:$changedDigest}' > upstream-provenance.json
          node scripts/gitops-policy.mjs scan upstream-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: 'upstream-provenance-${{ github.event.pull_request.head.sha }}', path: upstream-provenance.json, retention-days: 90, if-no-files-found: error}
