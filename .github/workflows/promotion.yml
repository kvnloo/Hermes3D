name: Promotion Validation
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-set:
    if: startsWith(github.head_ref, 'promotion/')
    name: promotion / exact-manifest
    runs-on: ubuntu-latest
    env:
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false, fetch-depth: 0}
      - name: Validate strict schema, attestation binding, and exact current dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.draft }}' = true
          test -f .gitops/promotion-manifest.json
          git fetch --no-tags origin dev
          current_dev="$(git rev-parse origin/dev)"
          test "$current_dev" = '${{ github.event.pull_request.base.sha }}'
          manifest_digest="$(jq -r .nightlyAttestation.manifestDigest .gitops/promotion-manifest.json)"
          artifact="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" | jq -s --arg name "nightly-trusted-$manifest_digest" '[.[].artifacts[]|select(.expired==false and .name==$name)]|if length==1 then .[0] else empty end')"
          test -n "$artifact"
          gh api "$(jq -r .archive_download_url <<<"$artifact")" > "$RUNNER_TEMP/nightly-trusted.zip"
          unzip -q "$RUNNER_TEMP/nightly-trusted.zip" -d "$RUNNER_TEMP/nightly-trusted"
          receipt="$RUNNER_TEMP/nightly-trusted/nightly-trusted-receipt.json"
          test "$(jq -r .manifestDigest "$receipt")" = "$manifest_digest"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$(jq -r .workflow_run.id <<<"$artifact")")"
          test "$(jq -r .name <<<"$run")" = 'Nightly Compose'
          test "$(jq -r .event <<<"$run")" = push
          test "$(jq -r .head_branch <<<"$run")" = dev
          test "$(jq -r .conclusion <<<"$run")" = success
          gh attestation verify "$receipt" --repo "$GITHUB_REPOSITORY"
          node scripts/gitops-policy.mjs validate-promotion .gitops/promotion-manifest.json "$current_dev" "$receipt" .gitops/nightly-manifest.json > promotion.digest
          node scripts/gitops-policy.mjs scan
      - name: Deterministic individual and all-set replay
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          base='${{ github.event.pull_request.base.sha }}'
          cp .gitops/promotion-manifest.json "$RUNNER_TEMP/promotion.json"
          jq -r '.features|sort_by(.order)[]|.headSha' "$RUNNER_TEMP/promotion.json" | while read -r sha; do
            git fetch --no-tags origin "$sha"
            git switch --detach "$base"
            git merge --no-commit --no-ff "$sha"
            git commit -m "deterministic individual replay $sha"
            GITHUB_BASE_SHA="$base" GITHUB_HEAD_SHA=HEAD node scripts/gitops-policy.mjs scan
          done
          git switch --detach "$base"
          jq -r '.features|sort_by(.order)[]|.headSha' "$RUNNER_TEMP/promotion.json" | while read -r sha; do git merge --no-ff --no-edit "$sha"; done
          GITHUB_BASE_SHA="$base" GITHUB_HEAD_SHA=HEAD node scripts/gitops-policy.mjs scan
          if test "$(jq -r .mode "$RUNNER_TEMP/promotion.json")" = all; then test "$(git rev-parse HEAD^{tree})" = "$(jq -r .nightlyAttestation.treeSha "$RUNNER_TEMP/promotion.json")"; fi
          printf '%s\n%s\n' "$(cat promotion.digest)" "$(git rev-parse HEAD^{tree})" > promotion-replay.receipt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: 'promotion-replay-${{ github.event.pull_request.head.sha }}', path: promotion-replay.receipt, retention-days: 90, if-no-files-found: error}
