name: Promotion Validation
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-set:
    if: startsWith(github.head_ref, 'promotion/')
    name: promotion / exact-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false, fetch-depth: 0}
      - run: |
          set -euo pipefail
          test '${{ github.event.pull_request.draft }}' = 'true'
          node scripts/gitops-policy.mjs scan
          test -f .gitops/promotion-manifest.json
          node -e 'const m=require("./.gitops/promotion-manifest.json"); if(m.captainGate!=="G1_G2_REQUIRED"||!Array.isArray(m.features)||!m.features.length) process.exit(1)'
          test "$(git rev-parse '${{ github.event.pull_request.base.sha }}')" = '${{ github.event.pull_request.base.sha }}'
